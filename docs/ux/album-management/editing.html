<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mori 사진 정리 방식 비교</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#293b2c;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}button,select,textarea{font:inherit;color:inherit}button,select{min-height:44px;border:1px solid #d7ddcd;border-radius:12px;background:transparent;padding:8px 12px}button{cursor:pointer}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #82965d;outline-offset:2px}.tools{background:#efefe7;padding:12px}.tools>div{max-width:600px;margin:auto}.tools small{display:block;margin-bottom:8px}.tools select{width:100%;background:#faf9f6}.tools p{font-size:12px;margin:8px 0 0;color:#647060}main{max-width:540px;margin:auto;padding:16px}header{display:flex;gap:12px;align-items:center;margin-bottom:20px}h1{font-size:17px;font-weight:500;margin:0;flex:1}.controls{display:flex;align-items:center;gap:8px;margin-bottom:16px}.controls span{flex:1;font-size:12px;color:#647060}.controls button{border:0;padding:8px}.hint{font-size:12px;color:#647060;margin-bottom:12px}.rows{display:grid;gap:12px;padding:0;margin:0;list-style:none}.row{display:grid;grid-template-columns:76px minmax(0,1fr) 44px;gap:10px;border-bottom:1px solid #e6e8df;padding:0 0 12px;align-items:start;position:relative}.row.target{outline:2px solid #82965d;outline-offset:4px}.photo{position:relative;border:0;border-radius:8px;background:linear-gradient(150deg,#d8c8d8 48%,#738b61 49%);width:76px;aspect-ratio:1;display:grid;place-items:center;color:#fff;font-size:20px;padding:0;overflow:hidden}.photo.changed{background:linear-gradient(135deg,#c2d9df 48%,#90825e 49%)}.photo small{position:absolute;bottom:0;left:0;right:0;background:#263b2ba6;color:white;font-size:11px;padding:4px}.photo-number{position:absolute;left:4px;top:3px;font-size:11px}.photo-wrap{position:relative}.remove{position:absolute;left:-9px;top:-9px;width:36px;min-height:36px;border:0;padding:0;border-radius:50%;background:#b75848;color:#fff;font-size:22px;box-shadow:0 0 0 4px #faf9f6}.remove:before{content:'';position:absolute;inset:-4px}.row label{min-width:0}.row textarea{display:block;width:100%;resize:vertical;border:0;border-radius:8px;background:#efefe780;padding:10px;min-height:76px;line-height:1.6}.row label small{font-size:11px;color:#647060}.handle,.more{width:44px;padding:4px;border:0;background:transparent;font-size:23px;min-height:76px}.handle{touch-action:none;cursor:grab}.menu{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.menu button{font-size:13px}.danger{color:#a34536}.empty{font-size:14px;color:#647060}.status{font-size:12px;color:#647060;margin-top:14px}dialog{width:min(440px,calc(100% - 24px));border:0;border-radius:20px;background:#faf9f6;padding:16px;color:#293b2c}dialog::backdrop{background:#263b2b66}dialog header{margin:0 0 12px}dialog h2{font-size:16px;font-weight:500;margin:0;flex:1}dialog .photo{width:100%;aspect-ratio:4/3}dialog p{font-size:13px}.choices{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.footer{max-width:540px;margin:auto;padding:16px;font-size:12px;color:#647060}button:disabled{opacity:.4;cursor:default}@media(max-width:350px){.row{grid-template-columns:64px minmax(0,1fr) 40px;gap:8px}.photo{width:64px}.row textarea{padding:8px;font-size:14px}.controls{gap:4px}}
</style><div class="tools"><div><small>사진 정리 방식 비교 모형 · 실제 사진·AI·저장 없음</small><select id="variant" aria-label="편집 방식"><option value="edit">추천 · 공통 편집 버튼 한 개</option><option value="menu">사진마다 더보기 메뉴</option></select><p>아래에서 글귀를 고치거나 사진 추가·삭제·교체·순서 변경을 비교할 수 있습니다. 바꾸는 사진도 합성 자료입니다.</p></div></div><main id="app"></main><dialog id="dialog" aria-label="사진 확인"><div id="dialog-content"></div></dialog><p class="footer">모형만 메모리에 반영됩니다. 실제 사진 추가는 카카오톡식 보내기로 연결할 예정입니다. NFC 감상 연출과 필터·자르기 기능은 넣지 않습니다.</p><script>
(()=>{const $=id=>document.getElementById(id);let style='edit',editing=false,menu=null,serial=8,message='',rows=Array.from({length:8},(_,i)=>({id:i+1,caption:'함께 걷던 길에 오래 머물고 싶던 날.',changed:false}));const dialog=$('dialog');let focusReturn=null;function button(text,action,cls='',label){const b=document.createElement('button');b.type='button';b.textContent=text;b.className=cls;if(label)b.setAttribute('aria-label',label);b.onclick=action;return b}function close(){dialog.close();focusReturn?.focus()}function open(title,content,actions,source){focusReturn=source;const d=$('dialog-content');d.replaceChildren();const header=document.createElement('header'),h=document.createElement('h2');h.textContent=title;header.append(h,button('×',close,'','닫기'));header.lastChild.setAttribute('aria-label','닫기');d.append(header);if(content)d.append(content);const a=document.createElement('div');a.className='choices';for(const item of actions??[])a.append(button(item.label,item.run,item.cls??''));d.append(a);dialog.showModal()}dialog.oncancel=e=>{e.preventDefault();close()};dialog.onclick=e=>{if(e.target===dialog)close()};function image(row,n){const d=document.createElement('div');d.className='photo'+(row.changed?' changed':'');d.textContent=row.changed?'새 사진':n;return d}function view(row,n,source){open(`${n}번째 사진`,image(row,n),[],source)}function replace(row,n,source){const p=document.createElement('p');p.textContent='합성 새 사진으로 교체해봅니다. 취소하면 기존 사진이 그대로 남습니다. 기존 글귀는 그대로 유지합니다. 교체를 위한 AI 글귀 호출은 하지 않습니다.';open('사진 바꾸기',p,[{label:'취소',run:close},{label:'새 사진 선택',run:()=>{row.changed=true;close();message='합성 새 사진으로 바뀌었어요.';render()}}],source)}function remove(row){const p=document.createElement('p');p.textContent='이 사진을 앨범에서 삭제할까요?';open('사진 삭제',p,[{label:'취소',run:close},{label:'삭제',cls:'danger',run:()=>{rows=rows.filter(r=>r.id!==row.id);if(!rows.length)editing=false;menu=null;close();message='모형에서 사진을 삭제했어요.';render()}}],document.activeElement)}function move(row,delta){const i=rows.findIndex(r=>r.id===row.id),next=i+delta;if(next<0||next>=rows.length)return;rows.splice(i,1);rows.splice(next,0,row);message=`${next+1}번째로 이동했어요.`;render();document.querySelector(`[data-handle="${row.id}"]`)?.focus()}function add(source){const p=document.createElement('p');p.textContent='실제 제품에서는 카카오톡식 사진 보내기로 이동합니다. 여기서는 합성 사진 한 장으로 추가를 확인합니다.';open('사진 추가',p,[{label:'취소',run:close},{label:'합성 사진 한 장 추가',run:()=>{rows.push({id:++serial,caption:'다시 꺼내 보고 싶은 순간.',changed:true});close();message='모형에 사진 한 장을 더했어요.';render()}}],source)}function render(){const app=$('app');app.replaceChildren();const header=document.createElement('header'),h=document.createElement('h1');h.textContent='여행의 순간';header.append(h);app.append(header);const controls=document.createElement('div');controls.className='controls';const n=document.createElement('span');n.textContent=`사진·글귀 ${rows.length}장`;controls.append(n);if(rows.length<20){const b=button('＋ 사진',()=>add(b));controls.append(b)}if(style==='edit'&&rows.length)controls.append(button(editing?'편집 마치기':'편집',()=>{editing=!editing;menu=null;message='';render()}));app.append(controls);if(editing){const hint=document.createElement('p');hint.className='hint';hint.textContent='글귀를 눌러 수정 · 손잡이를 끌어 순서 변경';app.append(hint)}const list=document.createElement('ol');list.className='rows';rows.forEach((row,index)=>{const n=index+1,li=document.createElement('li');li.className='row';li.dataset.id=row.id;const wrap=document.createElement('div');wrap.className='photo-wrap';const p=button('',()=>editing?replace(row,n,p):view(row,n,p),'photo'+(row.changed?' changed':''),`${n}번째 사진${editing?' 바꾸기':' 확인'}`);p.append(String(row.changed?'새 사진':n));if(editing){const label=document.createElement('small');label.textContent='바꾸기';p.append(label)}wrap.append(p);if(editing)wrap.append(button('−',()=>remove(row),'remove',`${n}번째 사진 삭제`));li.append(wrap);const label=document.createElement('label'),input=document.createElement('textarea'),saved=document.createElement('small');input.value=row.caption;input.maxLength=80;input.readOnly=!editing&&style==='edit';input.setAttribute('aria-label',`${n}번째 사진 글귀`);input.oninput=()=>{row.caption=input.value;saved.textContent='모형에 반영됨'};if(!editing&&style==='edit'){const text=document.createElement('p');text.textContent=row.caption;text.style.margin='8px 0';label.append(text);}else label.append(input,saved);li.append(label);if(editing){const handle=button('⠿',()=>{menu=menu===row.id?null:row.id;render()},'handle',`${n}번째 사진 순서 변경`);handle.dataset.handle=row.id;handle.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();move(row,e.key==='ArrowUp'?-1:1)}};let target=null,dragged=false,startY=0;handle.onpointerdown=e=>{startY=e.clientY;target=null;dragged=false;handle.setPointerCapture(e.pointerId)};handle.onpointermove=e=>{if(!handle.hasPointerCapture(e.pointerId))return;if(Math.abs(e.clientY-startY)<8&&!dragged)return;dragged=true;const slots=[...list.children];target=slots.reduce((best,item)=>Math.abs(item.getBoundingClientRect().top+item.clientHeight/2-e.clientY)<Math.abs(best.getBoundingClientRect().top+best.clientHeight/2-e.clientY)?item:best,slots[0]);slots.forEach(item=>item.classList.toggle('target',item===target))};handle.onpointerup=e=>{handle.releasePointerCapture(e.pointerId);if(dragged&&target){const next=rows.findIndex(r=>String(r.id)===target.dataset.id);const i=rows.findIndex(r=>r.id===row.id);rows.splice(i,1);rows.splice(next,0,row);menu=null;message=`${next+1}번째로 이동했어요.`;render()}};handle.onpointercancel=()=>{target=null;dragged=false;list.querySelectorAll('.target').forEach(e=>e.classList.remove('target'))};li.append(handle)}else if(style==='menu')li.append(button('···',()=>{menu=menu===row.id?null:row.id;render()},'more',`${n}번째 사진 더보기`));if(menu===row.id){const actions=document.createElement('div');actions.className='menu';if(!editing){const change=button('사진 바꾸기',()=>replace(row,n,change));actions.append(change,button('삭제',()=>remove(row),'danger'))}if(index>0)actions.append(button('앞으로 이동',()=>move(row,-1)));if(index<rows.length-1)actions.append(button('뒤로 이동',()=>move(row,1)));li.append(actions)}list.append(li)});if(!rows.length){const p=document.createElement('p');p.className='empty';p.textContent='사진을 골라 보내주세요.';app.append(p)}app.append(list);const status=document.createElement('p');status.className='status';status.setAttribute('role','status');status.textContent=message;app.append(status)}$('variant').onchange=e=>{style=e.target.value;editing=false;menu=null;render()};render()})();
</script></html>
