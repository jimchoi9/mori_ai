<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mori 사진 보내기·관리 흐름 비교</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#293b2c;font:15px/1.6 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif}button,select,textarea{font:inherit;color:inherit}button,select{min-height:44px;border:1px solid #d7ddcd;border-radius:12px;background:transparent;padding:8px 12px}button{cursor:pointer}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #82965d;outline-offset:2px}.tools{padding:12px;background:#efefe7;border-bottom:1px solid #d7ddcd}.tools>div{max-width:620px;margin:auto}.tools small{display:block;margin-bottom:8px}.tools select{width:100%;background:#faf9f6}.scenarios{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}main{max-width:540px;margin:auto;padding:16px;min-height:70vh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:12px;margin-bottom:20px}h1{font-size:17px;font-weight:500;margin:0;flex:1}small,.muted{font-size:12px;color:#647060}.body{flex:1}.guide{display:inline-block;background:#efefe7;border-radius:4px 16px 16px;padding:12px 14px}.group{width:86%;margin:12px 0 12px auto;background:#efefe7;padding:8px;border-radius:16px 4px 16px 16px}.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:3px}.photo{background:linear-gradient(155deg,#d8c8d8 48%,#738b61 49%);aspect-ratio:1;display:grid;place-items:center;border-radius:8px;color:#fff;font-size:20px}.group p{text-align:right;margin:6px 0 0;font-size:12px}.composer{position:sticky;bottom:0;background:#faf9f6;padding:12px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.primary{margin-left:auto;background:#46613d;color:#fff;border:0}.attach{display:flex;gap:4px;flex-basis:100%;max-width:240px}.attach .photo{width:70px}.management-actions{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.rows{display:grid;gap:12px}.row{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:start;padding-bottom:12px;border-bottom:1px solid #e6e8df}.row .photo{position:relative}.number{position:absolute;top:3px;left:5px;font-size:11px}.row textarea{display:block;width:100%;resize:vertical;border:0;border-radius:8px;background:#efefe780;padding:10px;min-height:76px;line-height:1.6}.row label small{display:block}.bottom{margin-top:20px;font-size:12px}.status{font-size:12px;color:#647060;margin-top:6px}.tool-note{padding:12px;max-width:620px;margin:0 auto;font-size:12px;color:#647060}button:disabled{opacity:.45;cursor:default}[hidden]{display:none!important}</style>
<div class="tools"><div><small>화면 비교 모형 · 실제 사진·AI·저장 없음</small><select id="variant" aria-label="비교할 흐름"><option value="adaptive">추천 · 처음은 보내기, 재방문은 관리</option><option value="upload_first">항상 보내기부터</option><option value="manage_first">항상 관리부터</option><option value="mixed">보내기·관리를 한 화면에</option></select><div class="scenarios"><button id="empty">빈 앨범으로 시작</button><button id="existing">사진 있는 앨범 재방문</button><button id="return">현재 사진 그대로 재방문</button></div></div></div>
<main id="app"></main><p class="tool-note">NFC의 로딩·책장 넘김·BGM은 관리 화면에 넣지 않습니다. ‘앨범 완성’ 방식과 완성 후 사진 수정 범위는 확인 중이므로 이 모형에서 감상을 활성화하지 않습니다.</p>
<script>
(()=>{let variant='adaptive',count=0,staged=0,view='upload',edited=false;const captions=new Map();const $=id=>document.getElementById(id);function entry(){view=variant==='mixed'?'combined':variant==='upload_first'||variant==='adaptive'&&(!count||staged)?'upload':'manage';render()}function btn(label,fn,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=fn;return b}function photo(n){const d=document.createElement('div');d.className='photo';d.textContent=n;return d}function render(){const app=$('app');app.replaceChildren();const h=document.createElement('header');if(view==='upload'&&count&&variant!=='mixed')h.append(btn('‹',()=>{view='manage';render()}));const title=document.createElement('h1');title.textContent='여행의 순간';h.append(title);const limit=document.createElement('small');limit.textContent='최대 20장';h.append(limit);app.append(h);const body=document.createElement('div');body.className='body';app.append(body);if(view!=='upload'){
 const actions=document.createElement('div');actions.className='management-actions';const label=document.createElement('span');label.className='muted';label.textContent=`사진·글귀 ${count}장`;actions.append(label);if(variant!=='mixed')actions.append(btn('＋ 사진',()=>{view='upload';render()}));body.append(actions);if(!count){const empty=document.createElement('p');empty.className='muted';empty.textContent='아직 담은 사진이 없어요.';body.append(empty)}const rows=document.createElement('div');rows.className='rows';for(let i=1;i<=count;i++){const row=document.createElement('div');row.className='row';row.append(photo(i));const label=document.createElement('label');const input=document.createElement('textarea');input.setAttribute('aria-label',`${i}번째 사진 글귀`);input.value=captions.get(i)??'함께 걷던 길에 오래 머물고 싶던 날.';input.maxLength=80;const saved=document.createElement('small');saved.textContent='';input.oninput=()=>{captions.set(i,input.value);edited=true;saved.textContent='모형에만 반영됨'};label.append(input,saved);row.append(label);rows.append(row)}body.append(rows);}
 if(view!=='manage'){
 if(!count){const guide=document.createElement('p');guide.className='guide';guide.textContent='이 앨범에 사진을 골라 보내주세요.';body.append(guide)}else if(variant!=='mixed'){const group=document.createElement('div');group.className='group';const mosaic=document.createElement('div');mosaic.className='mosaic';for(let i=1;i<=Math.min(count,4);i++)mosaic.append(photo(i===4&&count>4?`+${count-3}`:i));const status=document.createElement('p');status.textContent=`${count}장 저장 완료`;group.append(mosaic,status);body.append(group)}const composer=document.createElement('div');composer.className='composer';if(staged){const attach=document.createElement('div');attach.className='attach';for(let i=1;i<=Math.min(staged,3);i++)attach.append(photo(i===3&&staged>3?`+${staged-2}`:i));composer.append(attach)}if(count+staged<20)composer.append(btn(staged?'＋':'＋ 사진',()=>{staged=Math.min(12,20-count);render()}));if(staged)composer.append(btn(`${staged}장 보내기`,()=>{count+=staged;staged=0;render()},'primary'));if(count&&variant!=='mixed')composer.append(btn('사진·글귀 확인',()=>{view='manage';render()}));app.append(composer);}
 const status=document.createElement('p');status.className='status';status.textContent=staged?'고른 사진은 보내기를 누르기 전까지 전송되지 않아요.':edited?'이 비교 모형의 글귀는 실제 서비스에 저장되지 않아요.':'';app.append(status);}
 $('variant').onchange=e=>{variant=e.target.value;entry()};$('empty').onclick=()=>{count=0;staged=0;edited=false;captions.clear();entry()};$('existing').onclick=()=>{count=8;staged=0;edited=false;captions.clear();entry()};$('return').onclick=entry;entry();})();
</script></html>
