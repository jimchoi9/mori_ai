<div id="mori-upload-comparison">
  <div class="viz-carousel viz-dotted-background" aria-label="Mori 업로드 흐름 비교" data-previous-label="이전 안" data-next-label="다음 안">
    <section data-variant="한 화면 · 보내기 한 번" aria-label="한 화면에서 보내기 한 번">
      <div class="mori-demo" data-mode="one_send"></div>
    </section>
    <section data-variant="선택 즉시 전송" aria-label="사진 선택 후 자동 전송" hidden>
      <div class="mori-demo" data-mode="automatic"></div>
    </section>
    <section data-variant="단계별 확인" aria-label="별도 검토 화면에서 전송" hidden>
      <div class="mori-demo" data-mode="review_then_send"></div>
    </section>
  </div>
  <details class="mori-atlas">
    <summary>432개 구조 조합 살펴보기</summary>
    <div class="viz-controls" id="mori-atlas-controls"></div>
    <div class="text-small" id="mori-atlas-label" aria-live="polite"></div>
    <div class="mori-demo" data-mode="atlas"></div>
  </details>
</div>
<style>

#mori-upload-comparison .mori-list .mori-tile{aspect-ratio:auto;height:70px;padding-left:78px;display:flex;align-items:center;font-size:13px}

#mori-upload-comparison .mori-atlas summary{min-height:44px}
#mori-upload-comparison .mori-illustration-label{margin:4px auto 0;text-align:center;font-size:12px;color:var(--muted-foreground)}
@media(max-width:380px){#mori-upload-comparison .mori-content{padding:16px 14px 12px}#mori-upload-comparison .mori-footer{padding:14px}#mori-upload-comparison .mori-top{padding:16px 14px 4px}#mori-upload-comparison .mori-experiment{justify-content:start}}
</style>
<script>
(() => {
 const root=document.getElementById('mori-upload-comparison');
 const axes={entry:['direct','intro','wizard','chat','auto_picker','source_choice'],selection:['grid','strip','list'],send:['automatic','one_send','review_then_send'],progress:['in_place','blocking'],completion:['same_gallery','separate_done'],recovery:['per_file','restart_batch']};
 const labels={direct:'바로 사진 추가',intro:'소개 후 시작',wizard:'단계 안내',chat:'대화 안내',auto_picker:'진입 즉시 선택기',source_choice:'가져올 곳 선택',grid:'사진 격자',strip:'가로 사진 띠',list:'파일 목록',automatic:'선택 즉시 전송',one_send:'보내기 한 번',review_then_send:'별도 검토 후 전송',in_place:'같은 화면 진행',blocking:'전송 전용 화면',same_gallery:'저장된 격자 유지',separate_done:'별도 완료 화면',per_file:'남은 파일만 복구',restart_batch:'묶음 전체 다시 선택'};
 const axisLabels={entry:'진입',selection:'선택 사진',send:'전송 시작',progress:'진행 표시',completion:'완료',recovery:'실패 복구'};
 const scenarios={normal:'12장 보내기',twenty:'20장 보내기',excess:'21장 초과 선택',offline:'전송 중 연결 끊김',bad:'1장 준비 실패',existing:'8장 저장된 앨범',restart:'브라우저 종료 후 재진입'};
 const variants=[];
 function expand(keys,values={}){if(!keys.length){variants.push({...values,id:'U'+String(variants.length+1).padStart(3,'0')});return;}const[k,...rest]=keys;for(const v of axes[k])expand(rest,{...values,[k]:v});}
 expand(Object.keys(axes));
 const defaults={entry:'direct',selection:'grid',send:'one_send',progress:'in_place',completion:'same_gallery',recovery:'per_file'};
 let atlasConfig={...defaults};
 const demos=[];
 const shared={columns:3};
 const prior=window.openai?.widgetState;
 function persist(){if(window.openai?.setWidgetState)window.openai.setWidgetState({modelContent:{proposal:'Mori photo upload flow comparison'},privateContent:{scenarios:demos.map(d=>d.scenario),atlas:atlasConfig}}).catch(()=>{});}
 function applySaved(s){const p=s?.privateContent??s;if(p?.atlas&&Object.keys(axes).every(k=>axes[k].includes(p.atlas[k]))){atlasConfig={...p.atlas};for(const el of root.querySelectorAll('[data-axis]'))el.value=atlasConfig[el.dataset.axis];}if(Array.isArray(p?.scenarios))demos.forEach((d,i)=>{if(scenarios[p.scenarios[i]]&&d.scenario!==p.scenarios[i]){d.scenario=p.scenarios[i];d.reset(false);}});}
 const photoColors=[['#d5e6df','#6e8f72'],['#e3d6c4','#a78a68'],['#c7deeb','#648c9d'],['#e9d3cb','#aa7867'],['#d8dfbc','#83905c'],['#dcd6e7','#9180a6']];
 function art(i){const c=photoColors[(i-1)%photoColors.length];return '<div class="mori-art" style="--photo-bg:'+c[0]+';--photo-land:'+c[1]+'"><span>사진 '+String(i).padStart(2,'0')+'</span></div>';}
 class Demo {
  constructor(el){this.el=el;this.mode=el.dataset.mode;this.scenario='normal';this.timer=null;this.el.innerHTML='<div class="mori-experiment"><label class="form-label">시험 상황<select class="form-select" data-scenario>'+Object.entries(scenarios).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select></label><button class="btn btn-ghost" type="button" data-reset>처음부터</button><button class="btn btn-ghost" type="button" data-preset hidden>예시 전체 선택</button></div><div class="mori-phone" aria-label="Mori 사진 업로드 제안 화면"></div><div class="mori-illustration-label">화면 비교용 합성 이미지 · 전송은 모의 동작</div>';this.phone=this.el.querySelector('.mori-phone');this.el.querySelector('[data-scenario]').onchange=e=>{this.scenario=e.target.value;this.reset();persist();};this.el.querySelector('[data-preset]').onclick=()=>{this.picked=Array.from(this.phone.querySelectorAll('[data-action=toggle]'),b=>Number(b.dataset.photo));this.render();};this.el.querySelector('[data-reset]').onclick=()=>{this.reset();persist();};this.phone.onclick=e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled){this.act(b.dataset.action,Number(b.dataset.photo));persist();}};this.reset();}
  get config(){return this.mode==='atlas'?atlasConfig:{...defaults,send:this.mode};}
  reset(render=true){clearInterval(this.timer);this.timer=null;this.state='entry';this.picked=[];this.saved=this.scenario==='existing'?8:0;this.startSaved=this.saved;this.ready=0;this.batch=[];this.exhausted=false;this.reconnected=false;this.introStep=0;this.stripPage=0;if(this.scenario==='restart'){this.saved=8;this.startSaved=8;this.state='restart';}this.el.querySelector('[data-scenario]').value=this.scenario;if(render)this.render();}
  button(text,action,primary=false,disabled=false){return '<button type="button" class="'+(primary?'mori-main':'mori-link')+' cursor-interaction" data-action="'+action+'"'+(disabled?' disabled':'')+'>'+text+'</button>';}
  grid(ids,kind='selected'){let cls=this.config.selection==='list'?'mori-list':this.config.selection==='strip'?'mori-strip':'mori-grid';let shown=this.config.selection==='strip'?ids.slice(this.stripPage*3,this.stripPage*3+3):ids;return '<div class="'+cls+'">'+shown.map((i,idx)=>{const ready=kind==='saved'||(['progress','failure'].includes(kind)&&idx<this.ready);const failed=kind==='failure'&&idx===ids.length-1;return '<div class="mori-tile'+(failed?' is-attention':'')+'">'+art(i)+(this.config.selection==='list'?'<span>사진 '+i+'</span>':'')+((kind==='selected')?'<button type="button" class="mori-remove cursor-interaction" data-action="remove" data-photo="'+i+'" aria-label="사진 '+i+' 선택 해제"><b aria-hidden="true">×</b></button>':ready?'<span class="mori-mark" aria-label="저장 완료">✓</span>':failed?'<span class="mori-mark">확인</span>':'')+'</div>';}).join('')+'</div>'+(shown.length<ids.length?'<div class="mori-caption"><span>'+(this.stripPage*3+1)+'–'+Math.min(ids.length,this.stripPage*3+3)+' / '+ids.length+'장</span>'+this.button('다음 사진','strip-next')+'</div>':'');}
  openPicker(){clearInterval(this.timer);this.pickerReturn=this.state;if(['done','gallery','restart'].includes(this.state)){this.batch=[];this.startSaved=this.saved;}this.state='picker';this.picked=[];this.render();}
  start(){if(this.saved+this.batch.length>20){this.state='selected';this.render();return;}this.state='sending';this.ready=0;this.render();clearInterval(this.timer);this.timer=setInterval(()=>{if(this.scenario==='offline'&&this.ready===4&&!this.reconnected){clearInterval(this.timer);this.timer=null;this.state='offline';this.render();return;}const limit=this.scenario==='bad'&&!this.exhausted?this.batch.length-1:this.batch.length;if(this.ready<limit)this.ready++;if(this.ready>=limit){clearInterval(this.timer);this.timer=null;if(this.scenario==='bad'&&!this.exhausted){this.state='failure';this.render();return;}this.saved=this.startSaved+this.batch.length;this.state='done';}this.render();},260);}
  act(a,id){if(a==='strip-next'){this.stripPage=(this.stripPage+1)%Math.ceil(this.batch.length/3||this.saved/3||1);this.render();}else if(a==='choose'){if(['intro','wizard','chat','source_choice'].includes(this.config.entry)&&this.introStep<(this.config.entry==='wizard'?2:1)){this.introStep++;this.render();}else this.openPicker();}else if(a==='toggle'){this.picked=this.picked.includes(id)?this.picked.filter(x=>x!==id):[...this.picked,id];this.render();}else if(a==='picker-done'){this.batch=[...this.batch,...this.picked];this.state='selected';if(this.config.send==='automatic'&&this.saved+this.batch.length<=20)this.start();else this.render();}else if(a==='cancel'){this.state=this.batch.length?'selected':this.saved?'done':'entry';this.render();}else if(a==='remove'){this.batch=this.batch.filter(x=>x!==id);if(!this.batch.length)this.state=this.saved?'done':'entry';this.render();}else if(a==='send'){if(this.config.send==='review_then_send'&&this.state!=='review'){this.state='review';this.render();}else this.start();}else if(a==='retry'){if(this.config.recovery==='restart_batch'){this.saved=this.startSaved+this.ready;this.startSaved=this.saved;this.batch=[];this.openPicker();}else{this.exhausted=true;this.state='sending';this.render();this.timer=setTimeout(()=>{this.ready=this.batch.length;this.saved=this.startSaved+this.batch.length;this.state='done';this.render();},600);}}else if(a==='online'){this.reconnected=true;if(this.config.recovery==='restart_batch'){this.saved=this.startSaved+this.ready;this.startSaved=this.saved;this.openPicker();}else{this.state='sending';this.render();this.timer=setInterval(()=>{this.ready++;if(this.ready>=this.batch.length){clearInterval(this.timer);this.timer=null;this.saved=this.startSaved+this.batch.length;this.state='done';}this.render();},260);}}else if(a==='gallery'){this.state='gallery';this.render();}else if(a==='preview'){this.state='selected';this.render();}else if(a==='restart-choose'){this.batch=[];this.startSaved=this.saved;this.openPicker();}}
  render(){this.el.querySelector('[data-preset]').hidden=this.state!=='picker';const c=this.config;this.phone.style.setProperty('--m-columns',shared.columns);let title='',sub='',body='',foot='';const selected=this.batch.length;const intro=c.entry!=='direct'&&this.introStep<(c.entry==='wizard'?2:1);const total=this.saved+selected;
   if(this.state==='picker'){title='사진 선택';sub='휴대폰 사진 선택기 · 동작 예시';const n=this.scenario==='twenty'?20:this.scenario==='excess'?21:this.scenario==='existing'?12:12;body='<div class="mori-caption">'+this.button('취소','cancel')+'<span>'+this.picked.length+'장 선택</span></div><div class="mori-grid">'+Array.from({length:n},(_,idx)=>{const i=this.saved+this.batch.length+idx+1;return '<button type="button" class="mori-picker-photo cursor-interaction" data-action="toggle" data-photo="'+i+'" aria-pressed="'+this.picked.includes(i)+'" aria-label="사진 '+i+' 선택">'+art(i)+(this.picked.includes(i)?'<span class="mori-mark">'+(this.picked.indexOf(i)+1)+'</span>':'')+'</button>';}).join('')+'</div>';foot=this.button('추가'+(this.picked.length?' ('+this.picked.length+'장)':''),'picker-done',true,!this.picked.length);}
   else if(this.state==='entry'){title=this.saved?'사진 '+this.saved+'장이 담겨 있어요':'사진을 담아주세요';sub=this.saved?'원할 때 더 담을 수 있어요.':'좋아하는 순간을 한 번에 골라주세요.';if(c.entry==='intro'&&intro)body='<div class="mori-hero">사진을 고르면<br>편하게 보관할 수 있어요</div>';else if(c.entry==='wizard'&&intro)body='<div class="mori-step">시작 → 사진 선택 → 검토 → 전송</div><p>사진을 골라 추억을 담아보세요.</p>';else if(c.entry==='chat'&&intro)body='<div class="mori-chat">어떤 추억을 담아볼까요?<br>사진을 먼저 보내주세요.</div>';else if(c.entry==='source_choice'&&this.introStep===1)body='<div class="mori-source-row">'+this.button('휴대폰 사진','choose')+this.button('파일에서','choose')+'</div>';else if(c.entry==='auto_picker')body='<div class="mori-banner">자동으로 선택기 열기 요청<br>브라우저가 막으면 아래 버튼 사용</div>';else if(this.saved)body=this.grid(Array.from({length:this.saved},(_,i)=>i+1),'saved');else body='<div class="mori-destination">이 굿즈와 연결된 앨범에 저장돼요.</div><div class="mori-quiet">화질과 크기는 알아서 준비해요.</div>';foot=(c.entry==='source_choice'&&this.introStep===1)?'':this.button(intro?(c.entry==='wizard'?'다음':c.entry==='chat'?'사진 보낼게요':c.entry==='source_choice'?'사진 가져오기':'시작하기'):(c.send==='automatic'?'사진 고르고 바로 보내기':'사진 고르기'),'choose',true)+'<p>최대 20장'+(c.send==='automatic'?' · 선택하면 바로 전송돼요':'')+'</p>';}
