<div id="mori-upload-balanced">
  <div class="viz-controls" id="mori-comparison-controls">
    <label class="form-label">같은 상황으로 비교<select class="form-select" id="mori-common-scenario"><option value="normal">사진 12장</option><option value="twenty">사진 20장</option><option value="existing">기존 8장 + 새 사진 12장</option><option value="excess">21장 초과 선택</option><option value="offline">연결 끊김</option><option value="bad">사진 1장 실패</option></select></label>
    <label class="form-label">같은 단계 바로 보기<select class="form-select" id="mori-common-stage"><option value="entry">진입 · 직접 체험</option><option value="selected">사진 선택 직후</option><option value="sending">전송 중</option><option value="done">최종 상태</option></select></label>

    <section data-variant="중간안" aria-label="안내 말풍선을 남기고 반복 문구를 줄인 카카오톡식">
      <div class="mori-demo" data-mode="chat_balanced"></div>
    </section>
    <section data-variant="이전 카카오톡식" aria-label="이전 카카오톡식 전송" hidden>

    </section>
    <section data-variant="최소 문구안" aria-label="말풍선이 없는 이전 간결화안" hidden>
      <div class="mori-demo" data-mode="chat_refined"></div>
    </section>
  </div>
</div>
<style>

#mori-upload-balanced .mori-phone{--m-bg:light-dark(#faf9f6,#20251f);--m-ink:light-dark(#293b2c,#e6eadf);--m-muted:light-dark(#647060,#b9c2b0);--m-surface:light-dark(#efefe7,#30382d);--m-line:light-dark(#d7ddcd,#56614e);--m-green:light-dark(#46613d,#b6cba4);--m-on-green:light-dark(#fffef9,#1c3017);--m-fail:light-dark(#963b28,#ffba9f);box-sizing:border-box;max-width:360px;width:100%;margin:auto;min-height:680px;display:flex;flex-direction:column;background:var(--m-bg);color:var(--m-ink);border:1px solid var(--m-line);border-radius:24px;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;overflow-wrap:anywhere}

#mori-upload-balanced .mori-phone .mori-main{display:block;width:100%;min-height:52px;background:var(--m-green);color:var(--m-on-green);border-radius:15px;padding:12px;font-weight:500}

#mori-upload-balanced .mori-grid{display:grid;grid-template-columns:repeat(var(--m-columns,3),minmax(0,1fr));gap:8px;margin:16px 0}
#mori-upload-balanced .mori-tile{position:relative;min-width:0;border-radius:10px;background:var(--m-surface);aspect-ratio:1;overflow:hidden;isolation:isolate}
#mori-upload-balanced .mori-art{display:flex;align-items:end;justify-content:start;position:absolute;inset:0;padding:7px;isolation:isolate;background:var(--photo-bg);color:#243b32;font-size:12px}
#mori-upload-balanced .mori-art::before{content:"";position:absolute;width:110%;height:60%;bottom:-17%;left:-35%;border-radius:70% 70% 0 0;background:var(--photo-land);transform:rotate(-20deg);z-index:-1}
#mori-upload-balanced .mori-art::after{content:"";position:absolute;width:25%;height:25%;top:14%;right:15%;border-radius:50%;background:#fff8d2;z-index:-1}
#mori-upload-balanced .mori-art span{background:#fffdf5e8;padding:1px 5px;border-radius:4px}
#mori-upload-balanced .mori-phone .mori-remove{position:absolute;right:0;top:0;width:44px;min-height:44px;display:grid;place-items:center;z-index:1}
#mori-upload-balanced .mori-remove b{display:grid;place-items:center;background:#fffdf5;color:#243b32;border-radius:50%;width:24px;height:24px;font:500 19px/1 sans-serif}

#mori-upload-balanced .mori-picker-photo[aria-pressed=true]{outline:3px solid var(--m-green);outline-offset:-3px}
#mori-upload-balanced .mori-caption{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--m-muted);font-size:13px;margin:8px 0}
#mori-upload-balanced .mori-destination{padding:14px 0;color:var(--m-muted);font-size:13px;border-bottom:1px solid var(--m-line)}
#mori-upload-balanced .mori-quiet{margin:26px 0 0;display:flex;gap:8px;align-items:start;color:var(--m-muted);font-size:13px}
#mori-upload-balanced .mori-empty-grid{margin:24px 0 12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#mori-upload-balanced .mori-empty-grid div{aspect-ratio:1;border-radius:10px;background:var(--m-surface)}
#mori-upload-balanced .mori-empty-grid div:nth-child(n+4){opacity:.45}
#mori-upload-balanced .mori-status{display:block;font-size:14px;margin-bottom:8px}
#mori-upload-balanced .mori-track{height:5px;border-radius:5px;background:var(--m-surface);overflow:hidden}
#mori-upload-balanced .mori-track div{height:100%;background:var(--m-green)}
#mori-upload-balanced .mori-warning{color:var(--m-fail)!important}
#mori-upload-balanced .mori-banner{padding:12px 0;border-top:1px solid var(--m-line);border-bottom:1px solid var(--m-line);margin:16px 0;font-size:14px}
#mori-upload-balanced .mori-step{font-size:12px;letter-spacing:.02em;color:var(--m-muted);margin:0 0 20px}
#mori-upload-balanced .mori-hero{padding:28px 12px;border-radius:18px;background:var(--m-surface);margin:20px 0;text-align:center}
#mori-upload-balanced .mori-chat{padding:14px;background:var(--m-surface);border-radius:2px 16px 16px;margin:20px 0}
#mori-upload-balanced .mori-source-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#mori-upload-balanced .mori-source-row button{border:1px solid var(--m-line);border-radius:10px}
#mori-upload-balanced .mori-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
#mori-upload-balanced .mori-list{display:grid;gap:8px;margin:16px 0}
#mori-upload-balanced .mori-list .mori-tile{aspect-ratio:auto;height:70px;padding-left:78px;display:flex;align-items:center;font-size:13px}
#mori-upload-balanced .mori-list .mori-art{width:70px}
#mori-upload-balanced .mori-atlas{margin-top:24px}
#mori-upload-balanced .mori-atlas summary{min-height:44px}
#mori-upload-balanced .mori-illustration-label{margin:4px auto 0;text-align:center;font-size:12px;color:var(--muted-foreground)}
@media(max-width:380px){#mori-upload-balanced .mori-content{padding:16px 14px 12px}#mori-upload-balanced .mori-footer{padding:14px}#mori-upload-balanced .mori-top{padding:16px 14px 4px}#mori-upload-balanced .mori-experiment{justify-content:start}}
</style>
<script>
(() => {
 const root=document.getElementById('mori-upload-balanced');
 const scenarios={normal:'사진 12장',twenty:'사진 20장',excess:'21장 초과 선택',offline:'연결 끊김',bad:'사진 1장 실패',existing:'기존 8장 + 새 사진 12장'};
 const defaults={entry:'direct',selection:'grid',send:'one_send',progress:'in_place',completion:'same_gallery',recovery:'per_file'};
 const demos=[];
 const shared={columns:3,scenario:"normal",stage:"entry",keepGuide:false};
 const prior=window.openai?.widgetState;
 function persist(){window.openai?.setWidgetState?.({modelContent:{comparison:['중간안','이전 카카오톡식','최소 문구안'],scenario:shared.scenario},privateContent:{schema:'mori-balanced-flows-v1',scenario:shared.scenario,stage:shared.stage,keepGuide:shared.keepGuide}})?.catch(()=>{});}
 function applySaved(s){const p=s?.privateContent??s;if(p?.schema!=='mori-balanced-flows-v1')return;if(scenarios[p.scenario]&&['entry','selected','sending','done'].includes(p.stage)&&(shared.scenario!==p.scenario||shared.stage!==p.stage||shared.keepGuide!==Boolean(p.keepGuide))){shared.scenario=p.scenario;shared.stage=p.stage;shared.keepGuide=Boolean(p.keepGuide);showStage();}}
 const photoColors=[['#d5e6df','#6e8f72'],['#e3d6c4','#a78a68'],['#c7deeb','#648c9d'],['#e9d3cb','#aa7867'],['#d8dfbc','#83905c'],['#dcd6e7','#9180a6']];
 function art(i){const c=photoColors[(i-1)%photoColors.length];return '<div class="mori-art" style="--photo-bg:'+c[0]+';--photo-land:'+c[1]+'"><span>사진 '+String(i).padStart(2,'0')+'</span></div>';}
 class Demo {
  constructor(el){this.el=el;this.mode=el.dataset.mode;this.scenario='normal';this.timer=null;this.el.innerHTML='<div class="mori-experiment"><label class="form-label">시험 상황<select class="form-select" data-scenario>'+Object.entries(scenarios).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select></label><button class="btn btn-ghost" type="button" data-reset>처음부터</button><button class="btn btn-ghost" type="button" data-preset hidden>예시 전체 선택</button><button class="btn" type="button" data-play hidden>전송 재생</button><button class="btn" type="button" data-connect hidden>연결 복귀 재현</button></div><div class="mori-phone" aria-label="Mori 사진 업로드 제안 화면"></div><div class="mori-illustration-label">화면 비교용 합성 이미지 · 전송은 모의 동작</div>';this.phone=this.el.querySelector('.mori-phone');this.el.querySelector('[data-scenario]').onchange=e=>{this.scenario=e.target.value;this.reset();persist();};this.el.querySelector('[data-connect]').onclick=()=>{this.act('online');};this.el.querySelector('[data-play]').onclick=()=>{this.start();};this.el.querySelector('[data-preset]').onclick=()=>{this.picked=Array.from(this.phone.querySelectorAll('[data-action=toggle]'),b=>Number(b.dataset.photo));this.render();};this.el.querySelector('[data-reset]').onclick=()=>{this.scenario=shared.scenario;this.reset();persist();};this.phone.onclick=e=>{const b=e.target.closest('[data-action]');if(b&&!b.disabled){this.act(b.dataset.action,Number(b.dataset.photo));persist();}};this.reset();}
  get config(){return {...defaults,send:['chat_batch','chat_refined','chat_balanced'].includes(this.mode)?'one_send':this.mode};}
  reset(render=true){clearInterval(this.timer);this.timer=null;this.state='entry';this.picked=[];this.saved=this.scenario==='existing'?8:0;this.startSaved=this.saved;this.ready=0;this.batch=[];this.exhausted=false;this.reconnected=false;this.chatInspect=false;this.paused=false;this.introStep=0;this.stripPage=0;if(this.scenario==='restart'){this.saved=8;this.startSaved=8;this.state='restart';}this.el.querySelector('[data-scenario]').value=this.scenario;if(render)this.render();}
  button(text,action,primary=false,disabled=false){return '<button type="button" class="'+(primary?'mori-main':'mori-link')+' cursor-interaction" data-action="'+action+'"'+(disabled?' disabled':'')+'>'+text+'</button>';}
  grid(ids,kind='selected'){let cls=this.config.selection==='list'?'mori-list':this.config.selection==='strip'?'mori-strip':'mori-grid';let shown=this.config.selection==='strip'?ids.slice(this.stripPage*3,this.stripPage*3+3):ids;return '<div class="'+cls+'">'+shown.map((i,idx)=>{const ready=kind==='saved'||(['progress','failure'].includes(kind)&&idx<this.ready);const failed=kind==='failure'&&idx===ids.length-1;return '<div class="mori-tile'+(failed?' is-attention':'')+'">'+art(i)+(this.config.selection==='list'?'<span>사진 '+i+'</span>':'')+((kind==='selected')?'<button type="button" class="mori-remove cursor-interaction" data-action="remove" data-photo="'+i+'" aria-label="사진 '+i+' 선택 해제"><b aria-hidden="true">×</b></button>':ready?'<span class="mori-mark" aria-label="저장 완료">✓</span>':failed?'<span class="mori-mark">확인</span>':'')+'</div>';}).join('')+'</div>'+(shown.length<ids.length?'<div class="mori-caption"><span>'+(this.stripPage*3+1)+'–'+Math.min(ids.length,this.stripPage*3+3)+' / '+ids.length+'장</span>'+this.button('다음 사진','strip-next')+'</div>':'');}
  openPicker(){clearInterval(this.timer);this.pickerReturn=this.state;if(['done','gallery','restart'].includes(this.state)){this.batch=[];this.startSaved=this.saved;}this.state='picker';this.picked=[];this.render();}
  start(){if(this.saved+this.batch.length>20){this.state='selected';this.render();return;}this.paused=false;this.state='sending';this.ready=0;this.render();clearInterval(this.timer);this.timer=setInterval(()=>{if(this.scenario==='offline'&&this.ready===4&&!this.reconnected){clearInterval(this.timer);this.timer=null;this.state='offline';this.render();return;}const limit=this.scenario==='bad'&&!this.exhausted?this.batch.length-1:this.batch.length;if(this.ready<limit)this.ready++;if(this.ready>=limit){clearInterval(this.timer);this.timer=null;if(this.scenario==='bad'&&!this.exhausted){this.state='failure';this.render();return;}this.saved=this.startSaved+this.batch.length;this.state='done';}this.render();},260);}
  act(a,id){if(a==='inspect'){this.chatInspect=!this.chatInspect;this.render();}else if(a==='strip-next'){this.stripPage=(this.stripPage+1)%Math.ceil(this.batch.length/3||this.saved/3||1);this.render();}else if(a==='choose'){if(['intro','wizard','chat','source_choice'].includes(this.config.entry)&&this.introStep<(this.config.entry==='wizard'?2:1)){this.introStep++;this.render();}else this.openPicker();}else if(a==='toggle'){this.picked=this.picked.includes(id)?this.picked.filter(x=>x!==id):[...this.picked,id];this.render();}else if(a==='picker-done'){this.batch=[...this.batch,...this.picked];this.state='selected';if(this.config.send==='automatic'&&this.saved+this.batch.length<=20)this.start();else this.render();}else if(a==='cancel'){this.state=this.batch.length?'selected':this.saved?'done':'entry';this.render();}else if(a==='remove'){this.batch=this.batch.filter(x=>x!==id);if(!this.batch.length)this.state=this.saved?'done':'entry';this.render();}else if(a==='send'){if(this.config.send==='review_then_send'&&this.state!=='review'){this.state='review';this.render();}else this.start();}else if(a==='retry'){if(this.config.recovery==='restart_batch'){this.saved=this.startSaved+this.ready;this.startSaved=this.saved;this.batch=[];this.openPicker();}else{this.exhausted=true;this.state='sending';this.render();this.timer=setTimeout(()=>{this.ready=this.batch.length;this.saved=this.startSaved+this.batch.length;this.state='done';this.render();},600);}}else if(a==='online'){this.reconnected=true;if(this.config.recovery==='restart_batch'){this.saved=this.startSaved+this.ready;this.startSaved=this.saved;this.openPicker();}else{this.state='sending';this.render();this.timer=setInterval(()=>{this.ready++;if(this.ready>=this.batch.length){clearInterval(this.timer);this.timer=null;this.saved=this.startSaved+this.batch.length;this.state='done';}this.render();},260);}}else if(a==='gallery'){this.state='gallery';this.render();}else if(a==='preview'){this.state='selected';this.render();}el   renderRefined(){

  render(){this.el.querySelector('[data-connect]').hidden=this.state!=='offline';this.el.querySelector('[data-play]').hidden=!this.paused||this.state!=='sending';this.el.querySelector('[data-preset]').hidden=this.state!=='picker';const c=this.config;this.phone.style.setProperty('--m-columns',shared.columns);this.phone.classList.toggle('mori-refined',['chat_refined','chat_balanced'].includes(this.mode));this.phone.classList.toggle('mori-balanced',this.mode==='chat_balanced');this.el.querySelector('[data-reset]').textContent='이 안 처음부터 체험';let title='',sub='',body='',foot='';const selected=this.batch.length;const intro=c.entry!=='direct'&&this.introStep<(c.entry==='wizard'?2:1);const total=this.saved+selected;

   else if(['selected','review'].includes(this.state)){title=selected+'장 선택했어요';sub=total>20?'최대 20장까지 담을 수 있어요. '+(total-20)+'장만 빼주세요.':this.state==='review'?'이 사진들을 보낼까요?':'보내기 전까지 자유롭게 바꿀 수 있어요.';body=(total>20?'<div class="mori-banner mori-warning" role="alert">선택한 사진은 모두 그대로 있어요.</div>':'')+'<div class="mori-caption"><span>'+selected+'장 · 아직 보내지 않았어요</span>'+this.button('더 고르기','choose')+'</div>'+this.grid(this.batch);foot=this.button(total>20?(total-20)+'장 선택 해제 후 보내기':c.send==='review_then_send'&&this.state!=='review'?'다음':selected+'장 보내기','send',true,total>20)+'<p>전송이 끝날 때까지 화면을 열어주세요.</p>';}

 for(const el of root.querySelectorAll('.mori-demo'))demos.push(new Demo(el));
 const scenarioControl=root.querySelector('#mori-common-scenario');
