<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>가로 사진 감상 비교 · Mori</title><link rel="stylesheet" href="style.css"><script src="view.js" defer></script></head>
<body>
<header class="controls"><div class="heading"><span>Mori · 감상 화면 비교</span><button id="preview" type="button">감상만 보기</button></div><h1>세로로 들고, 함께 담긴 모습 그대로</h1><div class="choices" role="group" aria-label="사진 배치 비교"><button data-mode="plain" aria-pressed="true">① 전체 + 여백</button><button data-mode="blur" aria-pressed="false">② 전체 + 흐린 배경</button><button data-mode="crop" aria-pressed="false">기존 채우기</button></div><p id="description">추천안 · 사진과 글을 함께 모으고, 여백은 앨범 배경색으로 둡니다.</p></header>
<main class="reader" data-mode="plain" aria-label="세로 감상 화면"><article class="page"><div class="composition"><div class="picture"><img class="backdrop" src="assets/group-synthetic.jpg" alt="" aria-hidden="true"><img class="photo" src="assets/group-synthetic.jpg" width="1672" height="941" alt="나무 아래 테이블에 함께 앉아 있는 네 사람"><button type="button" id="open-photo" class="enlarge" aria-label="사진 크게 보기">⤢ 크게 보기</button></div><div class="copy"><p>함께 앉아 나누던 한낮의 시간.</p><small>비교용 예시 글귀</small></div></div><span class="position">1 / 1</span></article></main>
<button type="button" id="show-controls" hidden>비교로 돌아가기</button>
<dialog id="lightbox" aria-label="사진 크게 보기"><div class="lightbox-head"><span>사진 크게 보기</span><button type="button" id="close-photo">닫기 ✕</button></div><div id="canvas" tabindex="0" aria-label="확대한 사진. 방향키로 이동할 수 있어요."><img id="zoom-photo" src="assets/group-synthetic.jpg" alt="함께 앉아 있는 네 사람의 전체 사진" draggable="false"></div><footer class="zoom-tools"><p>두 손가락으로 확대 · 확대한 뒤 밀어서 살펴보기</p><div><button type="button" id="zoom-out" aria-label="사진 축소">−</button><output id="zoom-level" aria-live="polite">1×</output><button type="button" id="zoom-in" aria-label="사진 확대">＋</button><button type="button" id="reset">전체 보기</button></div></footer></dialog>
<p id="photo-error" role="alert" hidden>체험 사진을 불러오지 못했어요. 연결을 확인한 뒤 다시 열어 주세요.</p>
</body></html>
