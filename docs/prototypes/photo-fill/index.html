<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>꽉 찬 사진 · 자르기 정도 비교</title><link rel="stylesheet" href="nfc.css"><link rel="stylesheet" href="fill.css"><script src="page-flip.js" defer></script><script src="book.js" defer></script><script src="fill.js?v=2" type="module"></script></head>
<body class="nfc-mode"><main class="nfc-experience" data-mode="proposed"><div class="nfc-reader" id="reader" aria-label="사진 채우기 비교"></div><nav class="controls" aria-label="사진 배치 비교"><button type="button" id="settings" aria-expanded="false">비교 설정</button><section id="panel" hidden><h1>얼마나 크게 보여줄까요?</h1><div class="modes"><button type="button" data-mode="contain" aria-pressed="false">이전 변경안</button><button type="button" data-mode="proposed" aria-pressed="true">새 제안</button><button type="button" data-mode="cover" aria-pressed="false">완전 채우기</button></div><p id="policy">세로·정사각형은 꽉 채우고, 4:3까지는 점진적으로 전환합니다.</p><fieldset id="crop-choice"><legend>4:3 이상 사진 · 한쪽에서 자르는 최대 폭</legend><div class="crops"><button type="button" data-crop="0.1" aria-pressed="true">5%씩</button><button type="button" data-crop="0.2" aria-pressed="false">10%씩</button><button type="button" data-crop="0.3" aria-pressed="false">15%씩</button></div></fieldset><p id="metrics" aria-live="polite"></p><p class="note">사진 가운데를 기준으로 자릅니다. 얼굴을 자동으로 찾는 기능은 아닙니다.</p><div class="sources"><label class="pick">내 사진 선택<input id="photo-input" type="file" accept="image/*"></label><button type="button" id="sample">가로 예시 사진</button></div><p class="note">선택한 사진은 이 기기에서만 읽고 서버에 보내지 않아요. 같은 사진 3페이지로 넘김을 비교합니다.</p><button type="button" id="hide-settings">설정 닫고 감상하기</button></section></nav><p id="error" role="alert" hidden></p></main></body></html>
