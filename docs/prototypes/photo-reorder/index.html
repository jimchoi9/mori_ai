<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>사진 순서 바꾸기 · Mori 체험</title><link rel="stylesheet" href="style.css"><script type="module" src="reorder.js?v=2"></script></head>
<body><div class="experiment"><div><span>가상 사진 · 순서 변경 체험</span><button type="button" id="settings" aria-expanded="false">체험 설정</button></div><section id="settings-panel" hidden><div class="variants" role="group" aria-label="순서 변경 방식"><button type="button" data-mode="hold" aria-pressed="true">사진 길게 누르기</button><button type="button" data-mode="handle" aria-pressed="false">편집 후 손잡이</button></div><p>두 방식 모두 들어갈 자리를 미리 보여줍니다. 실제 사진이나 서버 저장에는 영향을 주지 않아요.</p><label><input type="checkbox" id="many">20장으로 스크롤 확인</label><label><input type="checkbox" id="fail">순서 저장 실패 상황</label><button type="button" id="reset">처음 순서로</button></section></div>
<main class="manager"><header><span class="back" aria-hidden="true">‹</span><h1>나의 사진첩</h1><span id="count">6 / 50</span></header><div class="sort-line"><p id="help">사진을 길게 눌러 원하는 자리에 놓아보세요.</p><select id="sort" aria-label="사진 정렬"><option value="date">촬영순</option><option value="manual">직접 배치</option></select></div><ol id="rows" aria-label="사진과 글귀"></ol></main>
<footer id="footer"><p id="save-state" role="status">사진 6장 저장됨</p><div id="footer-actions"><button type="button" id="add">＋ 예시 사진 추가</button><button type="button" id="edit"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m4 16-1 5 5-1L20 8l-4-4Z M14 6l4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>편집</button></div></footer>
<div id="toast" role="status" hidden></div><p id="announcement" class="sr-only" aria-live="polite"></p><p id="drag-help" class="sr-only">손잡이를 끌거나 누른 뒤 이동 메뉴를 선택할 수 있습니다. 손잡이에 초점을 두고 방향키로 옮길 수도 있습니다.</p>
<dialog id="preview" aria-label="사진 확인"><button type="button" id="close-preview">닫기 ✕</button><img id="preview-image" alt=""><p id="preview-caption"></p></dialog>
</body></html>
