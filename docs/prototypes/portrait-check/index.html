<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><title>세로사진 · 기존과 변경안 비교</title><link rel="stylesheet" href="nfc.css"><link rel="stylesheet" href="compare.css"><script src="page-flip.js" defer></script><script src="book.js" defer></script><script src="compare.js" defer></script></head>

<section id="choose" class="choose"><h1>세로사진으로 확인해 보세요</h1><p>방금 보여주신 사진을 선택해 주세요.<br>사진은 서버로 보내지 않고 이 화면에서만 읽어요.</p><label class="pick">테스트할 사진 선택<input id="photo-input" type="file" accept="image/*"></label></section>

<p id="error" role="alert" hidden></p></main></body></html>
