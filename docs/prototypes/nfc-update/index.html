<body class="nfc-mode"><main class="nfc-experience"><div id="reader" class="nfc-reader" aria-label="NFC 감상 체험"></div><div id="entry" class="entry"><h1>감상 다시 보기 체험</h1><p id="entry-text">실제 NFC·계정과 연결되지 않은 가상 체험입니다.</p><button id="tag" type="button">NFC를 태그한 상황으로 시작</button></div><nav class="tools"><button type="button" id="show-tools" aria-expanded="false">감상 메뉴</button><div id="panel" hidden><button type="button" id="update" class="primary">최신 내용 보기</button><p>수정한 내용이 있으면 새로 불러와요.</p><hr><strong>체험 설정</strong><label><input type="radio" name="mode" value="tab" checked>같은 탭에서는 새로고침해도 이어보기</label><label><input type="radio" name="mode" value="memory">화면 안에서만 최신 내용 보기</label><p>두 방식 모두 읽기 권한은 2시간이며 갱신해도 시간이 늘어나지 않는 안입니다.</p><button type="button" id="edit">관리에서 글을 수정한 상황 만들기</button><p id="versions"></p><button type="button" id="reload">브라우저 새로고침 체험</button><label><input type="checkbox" id="fail">연결 실패 상황 체험</label><p class="note">가상 사진·권한으로 작동하며 실제 제품은 바뀌지 않습니다. 이 모형은 예시 글만 갱신합니다.</p></div></nav><p id="notice" role="status" hidden></p></main></body></html>
