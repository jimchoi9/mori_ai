<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; form-action 'none'; base-uri 'none'"><title>Mori · 실제 사진 선택창 확인</title><link rel="stylesheet" href="style.css"></head><body><main><small>휴대폰 선택창 확인 · 전송 없음</small><header><h1>내 앨범</h1><button id="new-album" type="button">＋ 새 앨범</button></header><p class="intro">‘새 앨범’을 누르면 이 기기의 사진 선택창이 열립니다. 사진 선택을 확인하는 테스트이며 실제 앨범 생성·업로드는 하지 않습니다.</p><input id="photos" type="file" hidden multiple accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.jpg,.jpeg,.png,.webp,.heic,.heif"><p id="status" role="status">아직 사진을 선택하지 않았어요.</p><section id="results" aria-label="이번 탭의 사진 선택 결과"></section><button id="reset" type="button" class="reset" hidden>체험 초기화</button><p class="foot">사진 내용·위치정보를 읽지 않습니다. 파일 이름과 선택 장수만 이 화면에서 확인하며, 새로고침하면 사라집니다.</p></main><script src="start.js"></script></body></html>
