<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mori · 앨범 이름 검토</title><link rel="stylesheet" href="style.css"><body><aside><h1>앨범 이름 검토</h1><p>가상 사진 글귀로 실제 생성한 제목입니다. 이름 수정은 이 시안 안에서만 동작합니다.</p><label>상황 <select id="scenario"></select></label><label>페이지 이름 <select id="label"><option>내 앨범</option><option>내 사진첩</option><option>내 책장</option></select></label><details><summary>상황과 입력 단서</summary><p id="facts"></p></details><button id="late">이름 수정 후 늦은 자동 응답 시험</button><p id="diagnostic" role="status"></p><details><summary>15개 상황의 실제 제목 결과 비교</summary><div id="comparisons"></div></details></aside><main><header><a href="#" aria-label="Mori 홈">ⓜ <b>Mori</b></a><span>나</span></header><section id="list"><h1 id="heading">내 앨범</h1><div class="album-grid"><article><button id="open" class="cover" aria-label="앨범 열기"><span id="symbol">▧</span></button><div class="row"><h2 id="title"></h2></div><p id="meta"></p></article><article><button id="other-open" class="cover alternate" aria-label="다른 앨범 열기">▧</button><h2 id="other-title"></h2><p id="other-meta"></p></article></div></section><section id="detail" hidden><button id="back" class="back">‹ 내 앨범</button><h1 class="detail-heading"><button id="rename-detail" aria-label="앨범 이름 바꾸기"><span id="detail-title"></span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m16 3 5 5-12 12-6 1 1-6Z"/><path d="m13 6 5 5"/></svg></button></h1><p id="detail-meta"></p><div id="photo-list"></div><footer class="album-toolbar"><button class="primary" type="button" disabled>+ 사진 추가</button><button type="button" disabled>사진·글 편집</button></footer></section></main><dialog id="dialog"><form id="form"><h2>앨범 이름</h2><input id="name" aria-label="앨범 이름" maxlength="40" required><p id="error" role="alert"></p><div class="row"><button id="cancel" type="button">취소</button><button class="primary">저장</button></div></form></dialog><script type="module" src="app.mjs"></script></body></html>
