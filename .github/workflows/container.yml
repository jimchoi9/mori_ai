name: Build verified container
on:
  push:
    paths-ignore:
      - '**/*.md'
      - '**/*.pdf'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check deployment failure paths
        run: python3 -m unittest discover -s tests/deploy -p 'test_*.py' -v
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build test image (includes frontend checks)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          target: verification
          tags: mori-ai:verify-tests
          load: true
          cache-from: type=gha,scope=container-verification
          cache-to: type=gha,mode=max,scope=container-verification
      - name: Run full backend suite with isolated PostgreSQL
        run: MORI_VERIFY_TEST_IMAGE=mori-ai:verify-tests bash scripts/verify-db.sh backend/tests
      - name: Prepare runtime image tag
        id: runtime
        env:
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}:sha-${REVISION}"
          printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
      - name: Build runtime image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          target: runtime
          tags: ${{ steps.runtime.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          load: true
          cache-from: |
            type=gha,scope=container-runtime
            type=gha,scope=container-verification
          cache-to: type=gha,mode=max,scope=container-runtime
      - name: Publish verified image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
          REVISION: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
          image="ghcr.io/${REPOSITORY,,}:sha-${REVISION}"
          docker push "$image"
          printf 'Verified image: `%s`\n' "$image" >> "$GITHUB_STEP_SUMMARY"
