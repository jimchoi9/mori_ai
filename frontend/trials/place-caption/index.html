<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mori 글귀 시험</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ec;color:#293d34;font-family:system-ui,sans-serif}main{max-width:720px;margin:auto;padding:28px 20px 100px}header{font:italic bold 38px Georgia,serif;margin-bottom:30px}h1{font-size:25px;margin:0 0 12px}p{line-height:1.7}.note,#status{color:#687468;font-size:14px}button{font:inherit;font-size:16px;padding:15px 22px;border-radius:12px;border:1px solid #bdc8b9;cursor:pointer;background:#fffdf8;color:inherit}button:disabled{opacity:.5;cursor:default}.primary{background:#3f5b48;color:white;border:0}.actions{display:flex;gap:12px;margin:22px 0}.actions button{flex:1}article{display:grid;grid-template-columns:100px 1fr;gap:18px;padding:20px;margin:16px 0;background:#fffdf8;border:1px solid #dce0d3;border-radius:16px}img{width:100px;height:110px;object-fit:cover;border-radius:10px}article p{margin:0 0 8px}.meta{font-size:13px;color:#6c766c}.caption{font-size:18px;line-height:1.7;white-space:pre-wrap}.filename{overflow-wrap:anywhere;font-size:14px}.status{min-height:20px}input{display:none}@media(max-width:380px){main{padding:22px 14px 80px}article{grid-template-columns:74px 1fr;padding:14px;gap:12px}img{width:74px;height:88px}}
</style></head><body><main><header>mori</header><h1>사진으로 글귀 시험하기</h1><p class="note">한 번에 사진 1~2장을 골라 주세요. 새 글귀는 기존 앨범에 저장되지 않습니다.</p><div class="actions"><button id="pick" disabled>사진 선택</button><button id="run" class="primary" disabled>글귀 확인</button></div><input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" multiple><p id="status" role="status">시험 환경을 연결하고 있어요.</p><div id="photos"></div><p class="note">촬영 장소를 알고 있는 원본 사진을 쓰면 위치와 문장을 함께 확인할 수 있어요. 선택한 사진은 최적화한 뒤 OpenAI로 분석합니다.</p></main><script type="module" src="./main.ts"></script></body></html>
