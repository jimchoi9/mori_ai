services:
  postgres:
    image: postgres:17-bookworm
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mori}
      POSTGRES_DB: ${POSTGRES_DB:-mori}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a dedicated local POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    image: ${MORI_IMAGE:-mori-ai:dev}
    platform: linux/amd64
    build:
      context: .
      target: runtime
    environment: &backend_environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mori}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-mori}
      STORAGE_MODE: ${STORAGE_MODE:-local}
      STORAGE_ROOT: ${STORAGE_ROOT:-/app/media}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
  worker:
    image: ${MORI_IMAGE:-mori-ai:dev}
    platform: linux/amd64
    build:
      context: .
      target: runtime
    command: ["python", "-m", "backend.worker"]
    environment: *backend_environment
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 15s
volumes:
  postgres_data:
  media:
